# 自治体プロファイル例（架空の△△市 広報表記ガイド）。
# 規範（公用文作成の考え方）と衝突する箇所は、この組織規則を優先し、出力に明示する。
name: jichitai
comma: "、"          # 読点は「、」（この自治体の慣用）
strictness: normal   # 広報配布物は normal。内部の例規は strict に切り替える運用を想定。

# 対象語の上書き（規範より優先）。
# 「もの」は読みやすさのため常に仮名で書く方針 → 規範が実質名詞で漢字を求める箇所でも
# 組織規則を優先し、その旨を明示する（テストで検証する衝突ケース）。
overrides:
  もの:
    force: kana
    note: "△△市 広報表記ガイド: 『もの』は読みやすさのため仮名で統一"

# 用字用語集（規範に条項が無くても組織として統一する語）。
term_rules:
  - find: 子供
    use: 子ども
    note: "△△市 表記統一ルール（子ども）"
  - find: 障害者
    use: 障がい者
    note: "△△市 表記統一ルール（障がい）"

# 無効化する規則カテゴリ（例: 広報では半角括弧を許容する等）。既定は無し。
disabled_categories: []
disabled_clauses: []
